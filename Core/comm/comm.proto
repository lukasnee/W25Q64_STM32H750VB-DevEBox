syntax = "proto3";

enum COMM_CMD {
    // General Commands
    INTERCEPT = 0;
    RELEASE = 1;

    // LittleFS (File System) Commands
    LFS_OPEN = 10;
    LFS_CLOSE = 11;
    LFS_READ = 12;
    LFS_WRITE = 13;

    // QSPI FLASH Commands
    QSPI_WRITE = 20;
    QSPI_READ = 21;
    QSPI_SECTOR_ERASE = 22;
    QSPI_MASS_ERASE = 25;
}

enum COMM_RES {
    OK = 0;
    ERR_QSPI_MASS_ERASE = -8;
    ERR_QSPI_SECTOR_ERASE = -7;
    ERR_QSPI_OUT_OF_RANGE = -6;
    ERR_QSPI_WRITE = -4;
    ERR_QSPI_ABORT = -3;
    ERR_PARSE_RQ = -2;
    ERR_UNKNOWN_CMD = -1;
}

message CommCmdInterceptRq {
}

message CommCmdReleaseRq {
}

message CommCmdBasicRp {
    uint32 result = 1;
}

// LittleFS (File System) Commands

enum COMM_LFS_ERR {
    LFS_ERR_OK          = 0;    // No error
    LFS_ERR_IO          = -5;   // Error during device operation
    LFS_ERR_CORRUPT     = -84;  // Corrupted
    LFS_ERR_NOENT       = -2;   // No directory entry
    LFS_ERR_EXIST       = -17;  // Entry already exists
    LFS_ERR_NOTDIR      = -20;  // Entry is not a dir
    LFS_ERR_ISDIR       = -21;  // Entry is a dir
    LFS_ERR_NOTEMPTY    = -39;  // Dir is not empty
    LFS_ERR_BADF        = -9;   // Bad file number
    LFS_ERR_FBIG        = -27;  // File too large
    LFS_ERR_INVAL       = -22;  // Invalid parameter
    LFS_ERR_NOSPC       = -28;  // No space left on device
    LFS_ERR_NOMEM       = -12;  // No more memory available
    LFS_ERR_NOATTR      = -61;  // No data/attr available
    LFS_ERR_NAMETOOLONG = -36;  // File name too long
};

enum COMM_LFS_O {
    LFS_O_NONE = 0;
    LFS_O_RDONLY = 1;         // Open a file as read only
    LFS_O_WRONLY = 2;         // Open a file as write only
    LFS_O_RDWR   = 3;         // Open a file as read and write
    LFS_O_CREAT  = 0x0100;    // Create a file if it does not exist
    LFS_O_EXCL   = 0x0200;    // Fail if a file already exists
    LFS_O_TRUNC  = 0x0400;    // Truncate the existing file to zero size
    LFS_O_APPEND = 0x0800;    // Move to end of file on every write
};

message CommCmdLfsOpenRq {
    string path = 1;
    int32 flags = 2; // COMM_LFS_O
}

message CommCmdLfsOpenRp {
    int32 result = 1; // COMM_LFS_ERR
}

message CommCmdLfsCloseRq {
}

message CommCmdLfsCloseRp {
    int32 result = 1; // COMM_LFS_ERR
}

message CommCmdLfsReadRq {
    uint32 len = 1;
}

message CommCmdLfsReadRp {
    int32 result = 1; // COMM_LFS_ERR
    bytes buff = 2;
}

message CommCmdLfsWriteRq {
    bytes buff = 1;
}

message CommCmdLfsWriteRp {
    int32 result = 1; // COMM_LFS_ERR
}

// QSPI FLASH Commands

message CommCmdQspiWriteRq {
    uint32 addr = 1;
    bytes buff = 2;
}

message CommCmdQspiReadRq {
    uint32 addr = 1;
    uint32 len = 2;
}

message CommCmdQspiReadRp {
    uint32 addr = 1;
    bytes buff = 2;
}

message CommCmdQspiSectorEraseRq {
    uint32 addr_start = 1;
    uint32 addr_end = 2;
}

message CommCmdQspiMassEraseRq {
}
